<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Set Fira Code as default monospace font. Fira Code alone does NOT
       cover every glyph (e.g. U+262F YIN-YANG used by the zsh prompt, or
       CJK), so this uses <prefer>/<alias> instead of main-family matches:
       Fira Code stays the first (preferred) choice while fontconfig keeps
       the generic family (DejaVu, etc.) as a fallback for missing glyphs. -->
  <alias>
    <family>monospace</family>
    <prefer><family>Fira Code</family></prefer>
  </alias>
  <alias>
    <family>courier</family>
    <prefer><family>Fira Code</family></prefer>
  </alias>

  <!-- Use Fira Code as preferred UI/sans font for a consistent look, but
       keep real sans-serif/serif fonts as fallback for non-Latin glyphs. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Fira Code</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Fira Code</family></prefer>
  </alias>
</fontconfig>
