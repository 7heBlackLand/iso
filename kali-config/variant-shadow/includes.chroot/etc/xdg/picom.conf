# Shadow lightweight picom configuration
# Location: /etc/xdg/picom.conf  (system-wide, applies to every user)
#
# Goal: window transparency, soft shadows, desktop compositing — but kept
# LIGHT so a low-RAM machine does not waste CPU/GPU. No blur, no heavy
# animations, no fancy effects.

# XRender backend works everywhere and is very light (no GPU dependency).
backend = "xrender";

# No frame-pacing: we don't need smooth high-FPS compositing, save CPU.
vsync = false;

# Soft, cheap shadows
shadow = true;
shadow-radius = 6;
shadow-offset-x = -3;
shadow-offset-y = -3;
shadow-opacity = 0.30;
shadow-exclude = [
  "name = 'Notification daemon'",
  "class_g = 'Xfce4-notifyd'",
  "class_g = 'nm-applet'",
  "class_g = 'xfce4-power-manager'"
];

# No blur - expensive on low-RAM / weak GPUs
blur-background = false;

# Subtle fade, cheap and smooth
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Opacity handling (allows user-set transparency like the QTerminal theme)
inactive-opacity = 1.0;
inactive-opacity-override = false;
detect-client-opacity = true;

# Background everything when a fullscreen window is present -> nearly zero cost
unredir-if-possible = true;

# Keep tooltips/popups fully opaque so they stay readable
opacity-rule = [
  "100:class_g = 'Xfce4-notifyd'",
  "100:class_g = 'xfce4-panel'",
  "100:class_g = 'Thunar'"
];