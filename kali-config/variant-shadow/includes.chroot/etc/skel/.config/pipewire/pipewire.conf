# Shadow PipeWire configuration
#
# Lightweight, low-latency defaults for PipeWire on the live system.

context.properties = {
    link.max-buffers      = 16
    log.level             = 2
    core.daemon           = true
}

context.spa-libs = {
    audio.convert.* = spa-support
}

context.modules = [
    {   name = libpipewire-module-rt
        args = {
            nice.level = -11
            rt.prio    = 88
            rt.time.soft = 200000
            rt.time.hard = 200000
        }
    }
    {   name = libpipewire-module-protocol-native }
    {   name = libpipewire-module-client-node }
    {   name = libpipewire-module-adapter
        args = {
            factory.name = adapter
        }
    }
    {   name = libpipewire-module-metadata }
]